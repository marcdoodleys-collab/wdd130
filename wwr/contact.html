<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="author" content="Marc-Doodley SEMETUS">
    <meta name="description"
      content="Contact Show Rafting Company for reservations, questions, or suggestions">

    <title>Contact Us - Show Rafting Company</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>

        <img src="images/logo.jpg" alt="Rafting company logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>

    </header>

    <main>

        <h1>Contact Us</h1>

        <section class="company-infos">

            <h1>Company Information</h1>
            <p><strong>SHOW RAFTING COMPANY</strong></p>
            <p><strong>12 Rue Toussaint Louverture</strong></p>
            <p><strong>(509) 3228-7011</strong></p>
            <p><strong>infos@showraftingcompany.com</strong></p>

        </section>

        <section class="contact-container">

            <div class="map-form">

                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d15133.600090105869!2d-72.27190775!3d18.510816749999996!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sfr!2sht!4v1775517330030!5m2!1sfr!2sht"
                  width="100" height="200" allowfullscreen="" loading="lazy">
                </iframe>

            </div>

            <div class="form">

                <form>

                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Your email" required>

                    <p>Message Purpose</p>

                    <label>
                        <input type="radio" id="general" name="purpose" value="general">
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>

                    <label for="message">Message</label>

                    <textarea id="message" name="message" rows="5"
                      placeholder="Type here"></textarea>

                    <label>
                        <input type="checkbox" id="suggestioin" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Get in touch</button>

                </form>

            </div>

        </section>

        <section class="employee-profile">

            <h2>We are here to serve you!</h2>

            <div class="team-grid">

                <figure>
                    <img src="images/employee1.jpg" alt="Marc-Doodley, owner" width="120"
                      height="120">
                    <figcaption>Founder</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Yousguens" width="120" height="120">
                    <figcaption>Coordinator</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Sarah" width="120" height="120">
                    <figcaption>Rafting Guide</figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>

        <p>©2026 Show Rafting Company | Marc-Doodley SEMETUS</p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram">
            </a>

        </nav>

    </footer>

</body>

</html>
